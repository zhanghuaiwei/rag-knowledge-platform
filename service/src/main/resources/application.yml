spring:
  application:
    name: ragkb-service
  # 数据源（MyBatis-Plus 骨架）：仅在 ragkb.db.enabled=true 时由 DatabaseConfig 启用；
  # 关闭时这些属性不生效，service 无数据库也能启动（脚手架阶段）。
  # 凭证一律走环境变量，禁止硬编码。
  datasource:
    url: ${RAGKB_DB_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${RAGKB_DB_USERNAME:ragkb_app}
    password: ${RAGKB_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # Redis：refresh token 族 + access token 黑名单（JWT 认证）。凭证来自环境变量；
  # deploy/compose 的 REDIS_PASSWORD 由 deploy.sh 生成。连接为惰性，未调用不连接。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

# MyBatis-Plus 骨架配置（仅在 ragkb.db.enabled=true 时生效）
mybatis-plus:
  global-config:
    banner: false
    db-config:
      # Schema 主键为 BIGINT GENERATED BY DEFAULT AS IDENTITY，由数据库生成（见 deploy/ddl/init.sql）
      id-type: auto
      # 全表统一审计列（deploy/ddl/migrations/V0.3__unified_audit_columns.sql）：
      # del_flag 逻辑删除；create_by/create_time/update_by/update_time 由 AuditMetaObjectHandler 自动填充
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # snake_case 列 → camelCase 属性（MyBatis-Plus 默认值，显式声明便于核对）
    map-underscore-to-camel-case: true
  # 复杂查询 XML 放 resources/mapper/ 下同名文件
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8080

# 探针与运维端点：K8s liveness/readiness 依赖（06-架构方案 §2）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# 脚手架阶段无数据库/对象存储连接；业务数据源在对应模块实现时按
# 04-数据库设计 接入，凭证一律走环境变量，禁止硬编码。

# rag-engine（Python）对接配置（06-架构方案）；实际对接由人工在
# modules/rag/adapter/RagEngineHttpClient 中实现。
rag-engine:
  base-url: ${RAG_ENGINE_BASE_URL:http://rag-engine.ragkb.svc:8000}
  timeout-ms: ${RAG_ENGINE_TIMEOUT_MS:10000}

# CORS：前端直连来源（逗号分隔），携带会话 cookie 需要 allowCredentials。
ragkb:
  cors:
    allowed-origins: ${RAGKB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 数据访问开关：false（默认）脚手架阶段无数据库也能启动；
  # 实现数据层时置 RAGKB_DB_ENABLED=true 并配置上方 spring.datasource 凭证。
  db:
    enabled: ${RAGKB_DB_ENABLED:false}
  # 认证模式：form（开发默认，账号密码）| oidc（生产，企业 IdP）
  auth:
    mode: ${RAGKB_AUTH_MODE:form}
    # form 模式开发用内存账号（⚠️ 仅开发/演示，生产走 oidc 不暴露表单登录）
    dev:
      username: ${RAGKB_DEV_USERNAME:admin}
      password: ${RAGKB_DEV_PASSWORD:admin123}
      roles: ${RAGKB_DEV_ROLES:TENANT_ADMIN}
    # oidc 模式配置（仅 ragkb.auth.mode=oidc 时由 SecurityConfig 解析 issuer 元数据）
    oidc:
      client-id: ${RAGKB_OIDC_CLIENT_ID:}
      client-secret: ${RAGKB_OIDC_CLIENT_SECRET:}
      issuer-uri: ${RAGKB_OIDC_ISSUER_URI:}
  # JWT（form 模式）：secret 生产必须通过 RAGKB_JWT_SECRET 注入（>=32 字节随机串，禁止硬编码）。
  # 下方默认值仅为本地 dev 启动兜底（TokenServiceImpl 校验 >=32 字节，弱密钥/空值拒绝启动）；
  # ⚠️ form 模式仅限开发/演示，生产走 oidc 由企业 IdP 承载认证，不依赖本 secret。
  jwt:
    secret: ${RAGKB_JWT_SECRET:change-me-dev-only-0123456789abcdef}
    issuer: ${RAGKB_JWT_ISSUER:ragkb}
    access-ttl: ${RAGKB_JWT_ACCESS_TTL:15m}
    refresh-ttl: ${RAGKB_JWT_REFRESH_TTL:30d}
    refresh-cookie-max-age-seconds: ${RAGKB_JWT_REFRESH_COOKIE_MAX_AGE_SECONDS:2592000}
  # API Key 摘要 pepper：生产必须通过 RAGKB_API_KEY_PEPPER 注入（变更会令所有已存 key 失效）。
  # 默认值为 dev 兜底（仅限 form/dev 场景）。
  api-key:
    pepper: ${RAGKB_API_KEY_PEPPER:dev-only-api-key-pepper-change-me}
  # refresh cookie 是否加 Secure：生产 https 置 RAGKB_COOKIE_SECURE=true
  cookie:
    secure: ${RAGKB_COOKIE_SECURE:false}
