[project]
name = "rag-engine"
version = "0.2.0"
description = "通用企业知识库平台 — RAG 引擎（解析/检索/精排/生成）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # ---- 最小 RAG 链路（2026-08-17 新增）----
    # 文档分块用 langchain 的 RecursiveCharacterTextSplitter（真正的「用 langchain 处理文档」的核心件）；
    # 向量写入/检索直连 pgvector（chunk_meta.embedding），不引入 langchain 自带向量库，避免与 DDL 脱节。
    "langchain-text-splitters>=0.2",
    # OpenAI 兼容 SDK：通义 DashScope / 硅基流动 / 智谱等统一走 base_url + api_key。
    "openai>=1.40",
    # 向量存储：psycopg[binary,pool] 提供同步连接池 + 原生 vector 类型适配。
    "psycopg[binary,pool]>=3.2",
    # MinIO/S3 对象存储读取原文。
    "minio>=7.2",
]

[project.scripts]
rag-engine = "rag_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
