      summary: 我的收藏
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PageData" }
    post:
      tags: [documents]
      summary: 收藏文档
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: integer, format: int64 }
      responses:
        "204":
          description: 已收藏
    delete:
      tags: [documents]
      summary: 取消收藏
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: integer, format: int64 }
      responses:
        "204":
          description: 已取消

  /api/v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [governance]
      summary: 通用异步任务状态（进度/错误/取消/重试）
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Task" }
    post:
      tags: [governance]
      summary: 取消任务（仅 RUNNING/QUEUED）
      responses:
        "202":
          description: 已请求取消
