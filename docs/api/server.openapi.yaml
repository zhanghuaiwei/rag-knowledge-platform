      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewActionRequest" }
      responses:
        "200":
          description: 已驳回
  /api/v1/documents/{documentId}/withdraw:
    post:
      tags: [governance]
      summary: 撤回（PUBLISHED → WITHDRAWN，退出检索）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
