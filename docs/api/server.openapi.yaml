      responses:
        "201":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RetentionPolicy" }
  /api/v1/legal-holds:
