      responses:
        "201":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MetadataSchema" }
  /api/v1/metadata-schemas/{schemaId}/publish:
    post:
      tags: [governance]
      summary: 发布 schema 版本（发布后不可变）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MetadataSchema" }
