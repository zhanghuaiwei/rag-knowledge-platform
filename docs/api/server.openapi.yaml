                    properties:
                      data: { $ref: "#/components/schemas/PageData" }
  /api/v1/reviews/{reviewId}/approve:
    post:
      tags: [governance]
      summary: 审核通过（PUBLISHED，绑定 documentVersionId 防 A 审 B 发）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewActionRequest" }
