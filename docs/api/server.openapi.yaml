                      data: { $ref: "#/components/schemas/LegalHold" }

  /api/v1/search:
    get:
      tags: [search-chat]
      summary: 全文搜索（BM25 + 可选向量融合；授权预过滤 + 高亮）
      security:
        - oidcSession: []
        - apiKeyAuth: []
      parameters:
        - { $ref: "#/components/parameters/cursor" }
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 512 }
        - name: kbIds
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: fileExts
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: sensitivity
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: 命中的授权文档切片（分页/游标）
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CursorPageData" }
  /api/v1/search/hits/{hitId}/excerpt:
    get:
      tags: [search-chat]
      summary: 命中片段引用（重新授权后返回）
      security:
        - oidcSession: []
        - apiKeyAuth: []
      parameters:
        - name: hitId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          excerpt: { type: string }
                          location: { type: object, nullable: true }
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/chats:
    get:
      tags: [search-chat]
      summary: 我的会话列表
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PageData" }
    post:
      tags: [search-chat]
      summary: 创建会话（选择 1-5 个知识库）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSessionCreateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChatSession" }
  /api/v1/chats/{chatId}:
    parameters:
      - name: chatId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [search-chat]
      summary: 会话消息列表（分页）
      parameters:
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CursorPageData" }
    delete:
      tags: [search-chat]
      summary: 删除会话（逻辑删除）
      responses:
        "204":
          description: 已删除
  /api/v1/chats/{chatId}/messages:
    post:
      tags: [search-chat]
      summary: 提问（SSE 流式；先 meta，再 token*，再 sources?，再 final）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatAskRequest" }
      responses:
        "200":
          description: SSE 事件流；事件：meta / token / sources / final / error（见 03-详细设计 §9.3）
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: meta\\ndata: {\\\"requestId\\\":\\\"...\\\",\\\"messageId\\\":1,\\\"modelRoute\\\":\\\"...\\\",\\\"promptVersion\\\":1}\\n\\n"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/chats/{chatId}/messages/{messageId}/feedback:
    post:
      tags: [search-chat]
      summary: 回答反馈（赞/踩，踩时建议填写原因）
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "204":
          description: 已记录反馈
  /api/v1/messages/{messageId}/sources/{sourceId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: sourceId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [search-chat]
      summary: 引用来源（按当前权限重新授权；撤权后显示"来源不可再访问"）
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiResponse" }
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ChatSource" }
        "403":
          description: 来源已撤权/不可访问（不泄漏标题与摘要）
          $ref: "#/components/responses/Forbidden"

