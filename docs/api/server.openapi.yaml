                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RetentionPolicy" }
    post:
      tags: [governance]
      summary: 创建保留策略
      parameters:
        - { $ref: "#/components/parameters/idempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, retentionDays]
              properties:
                name: { type: string }
